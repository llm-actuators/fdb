[package]
name = "fdb"
version = "0.1.0"
edition = "2024"
description = "Figma Debug Bridge — extract semantic schema from Figma designs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json"] }
dirs-next = "2"
